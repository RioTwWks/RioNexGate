openapi: 3.0.3
info:
  title: RioNexGate API
  description: REST API for RioNexGate panel (Xray-core / sing-box management)
  version: 1.0.0
servers:
  - url: /api
    description: Relative to panel origin (e.g. http://localhost:8888/api)
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      tags: [System]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  core:
                    type: string
                    example: xray
  /docs:
    get:
      summary: Swagger UI
      security: []
      tags: [System]
      responses:
        "200":
          description: HTML Swagger UI page
  /openapi.yaml:
    get:
      summary: OpenAPI specification
      security: []
      tags: [System]
      responses:
        "200":
          description: OpenAPI YAML document
  /protocols:
    get:
      summary: Supported client link protocols
      tags: [System]
      responses:
        "200":
          description: List of protocol identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  protocols:
                    type: array
                    items:
                      type: string
                    example: [vless, vmess, trojan]
  /users:
    get:
      summary: List users
      tags: [Users]
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      summary: Get user
      tags: [Users]
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update user
      tags: [Users]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: Delete user
      tags: [Users]
      responses:
        "204":
          description: Deleted
  /users/{id}/link:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: proto
        in: query
        schema:
          type: string
          enum: [vless, vmess, trojan]
          default: vless
        description: Client protocol for the connection link
    get:
      summary: Get client connection link
      tags: [Users]
      responses:
        "200":
          description: Connection URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: string
                  protocol:
                    type: string
  /subscription/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Base64-encoded subscription link list
      security: []
      tags: [RioNexTunnel]
      responses:
        "200":
          description: Standard base64 subscription
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /client/register:
    post:
      summary: Register a RioNexTunnel device
      security: []
      tags: [RioNexTunnel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDeviceResponse"
  /client/config:
    get:
      summary: JSON client config with config_hash
      tags: [RioNexTunnel]
      security:
        - DeviceTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceToken"
      responses:
        "200":
          description: Client configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientConfig"
        "401":
          $ref: "#/components/responses/DeviceUnauthorized"
  /client/stats:
    post:
      summary: Report client telemetry
      tags: [RioNexTunnel]
      security:
        - DeviceTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientStatsRequest"
      responses:
        "200":
          description: Stats accepted
  /client/commands:
    get:
      summary: Long-poll for remote commands
      tags: [RioNexTunnel]
      security:
        - DeviceTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/DeviceToken"
        - name: timeout
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Pending commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCommandsResponse"
  /stats/client:
    get:
      summary: RioNexTunnel client metrics
      tags: [Stats]
      responses:
        "200":
          description: Active devices and sync counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMetrics"
  /users/{id}/qr:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - name: proto
        in: query
        schema:
          type: string
          enum: [vless, vmess, trojan]
          default: vless
    get:
      summary: Get QR code for connection link
      tags: [Users]
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /stats/total:
    get:
      summary: Total traffic statistics
      tags: [Stats]
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotalStats"
  /stats/user/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      summary: Per-user traffic statistics
      tags: [Stats]
      responses:
        "200":
          description: User traffic history
  /core/type:
    get:
      summary: Get active core type
      tags: [Core]
      responses:
        "200":
          description: Core type
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [xray, sing-box]
    put:
      summary: Switch core type
      tags: [Core]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [xray, sing-box]
      responses:
        "200":
          description: Core switched
  /core/reload:
    post:
      summary: Regenerate and reload core config
      tags: [Core]
      responses:
        "200":
          description: Reload triggered
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    DeviceTokenAuth:
      type: apiKey
      in: header
      name: X-Device-Token
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DeviceToken:
      name: X-Device-Token
      in: header
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        traffic_gb:
          type: integer
          format: int64
        used_gb:
          type: number
          format: double
        expires_at:
          type: string
          format: date-time
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        traffic_gb:
          type: integer
          format: int64
        expire_days:
          type: integer
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
        traffic_gb:
          type: integer
        expire_days:
          type: integer
        active:
          type: boolean
    TotalStats:
      type: object
      properties:
        total_used_gb:
          type: number
        points:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
              bytes_up:
                type: integer
              bytes_down:
                type: integer
    ClientLink:
      type: object
      properties:
        link:
          type: string
        protocol:
          type: string
    RegisterDeviceRequest:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
        label:
          type: string
    RegisterDeviceResponse:
      type: object
      properties:
        device_token:
          type: string
        subscription_url:
          type: string
    ClientConfig:
      type: object
      properties:
        config_hash:
          type: string
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ClientServer"
        inbounds:
          type: object
        dns:
          type: object
    ClientServer:
      type: object
      properties:
        protocol:
          type: string
        link:
          type: string
        id:
          type: string
        host:
          type: string
        port:
          type: integer
    ClientStatsRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
        bytes_in:
          type: integer
        bytes_out:
          type: integer
        sessions:
          type: integer
        status:
          type: string
    ClientCommandsResponse:
      type: object
      properties:
        commands:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
    ClientMetrics:
      type: object
      properties:
        active_devices:
          type: integer
        sync_requests:
          type: integer
        registration_fails:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeviceUnauthorized:
      description: Missing or invalid X-Device-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
