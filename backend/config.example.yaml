server:
  port: 8080
  # REQUIRED: long random value (min 16 chars). Placeholders like change-me-to-secure-key are rejected at startup.
  api_key: "change-me-to-secure-key"   # same key used in the web panel
  # Optional: allow RioNexTunnel to register devices without the admin API key.
  # registration_secret: "long-random-registration-secret"
  # DANGEROUS: unauthenticated POST /api/client/register (LAN/dev only).
  allow_open_register: false

database:
  path: "./data/rionexgate.db"

core:
  type: "xray"   # or "sing-box" / "skadi"
  listen_port: 443
  public_host: "proxy.example.com"    # host in VLESS links (domain or IP)
  stats_poll_seconds: 60
  xray:
    config_path: "./data/xray/config.json"
    binary_path: "/usr/local/bin/xray"
    # Where the backend container connects for stats (host-gateway from bridge network).
    api_address: "host.docker.internal:10085"
    # Bind address in generated Xray config (default: 127.0.0.1 — never 0.0.0.0).
    # For Docker bridge → host stats without opening all interfaces, set e.g. 172.17.0.1:10085
    # and keep a host firewall. Leave empty to use loopback derived from api_address.
    api_listen: "127.0.0.1:10085"
  singbox:
    config_path: "./data/sing-box/config.json"
    binary_path: "/usr/local/bin/sing-box"
    api_address: "127.0.0.1:9090"
  skadi:
    config_path: "./data/skadi/skadi.toml"
    binary_path: "/usr/local/bin/skadicore"
    api_address: "127.0.0.1:10086"              # Skadi gRPC (loopback only)
    api_token: "change-me-skadi-api-token"
    metrics_address: "127.0.0.1:9091"            # optional Prometheus /healthz

  # Anti-DPI stealth presets (Reality + XHTTP / Vision / optional TLS).
  # Generate keypair: xray x25519  OR  skadicore genkey reality
  # (see README.md / README.ru.md and docs/stealth.md)
  # Note: SkadiCore uses a single listen port (XHTTP preferred) and does not
  # support xtls-rprx-vision — panel emits TCP+Reality without Vision flow.
  stealth:
    enabled: true
    fingerprint: firefox            # firefox or edge recommended (not chrome/safari)
    reality:
      dest: "www.example-cdn.com:443"
      server_names:
        - "www.example-cdn.com"
      private_key: "REPLACE_WITH_PRIVATE_KEY"
      public_key: "REPLACE_WITH_PUBLIC_KEY"
      short_ids:
        - "a1b2c3d4"
      show: false
      xver: 0
    xhttp:
      enabled: true
      port: 443
      path: "/api/v1/data"
      mode: stream-one              # do not use auto — known client bugs
      tag: vless-xhttp-reality
    vision:
      enabled: true
      port: 8443
      tag: vless-vision-reality
    tls:
      enabled: false
      port: 2053
      sni: "proxy.example.com"
      alpn: ["h2", "http/1.1"]
      tag: vless-tls
    fragmentation:
      enabled: false
      strategy: serverhello
      length: "50-100"
      delay: "10-20"
      max_split: "2-4"
    awg:
      enabled: false
      port: 51820
      subnet: "10.8.0.0/24"
      server_address: "10.8.0.1/24"
      config_path: "./data/awg/awg0.conf"
      private_key: "REPLACE_WITH_AWG_SERVER_PRIVATE_KEY"
      public_key: "REPLACE_WITH_AWG_SERVER_PUBLIC_KEY"
      jc: 4
      jmin: 40
      jmax: 70
      s1: 84
      s2: 0
      h1: 1286472620
      h2: 2995958389
      h3: 641212874
      h4: 3523276991
      tag: awg-reserve

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  admin_ids: [123456789]

limits:
  default_traffic_gb: 50
  default_expire_days: 30
