server:
  port: 8080
  api_key: "change-me-to-secure-key"   # тот же ключ вводится в веб-панели

database:
  path: "./data/rionexgate.db"

core:
  type: "xray"   # or "sing-box"
  listen_port: 443
  public_host: "proxy.example.com"    # хост в VLESS-ссылках (домен или IP)
  stats_poll_seconds: 60
  xray:
    config_path: "./data/xray/config.json"
    binary_path: "/usr/local/bin/xray"
    api_address: "host.docker.internal:10085"
  singbox:
    config_path: "./data/sing-box/config.json"
    binary_path: "/usr/local/bin/sing-box"
    api_address: "127.0.0.1:9090"

  # Anti-DPI stealth presets (Reality + XHTTP / Vision / optional TLS).
  # Generate keypair: xray x25519  (see README and docs/stealth.md)
  stealth:
    enabled: true
    fingerprint: firefox            # firefox or edge recommended (not chrome/safari)
    reality:
      dest: "www.example-cdn.com:443"
      server_names:
        - "www.example-cdn.com"
      private_key: "REPLACE_WITH_PRIVATE_KEY"
      public_key: "REPLACE_WITH_PUBLIC_KEY"
      short_ids:
        - "a1b2c3d4"
      show: false
      xver: 0
    xhttp:
      enabled: true
      port: 443
      path: "/api/v1/data"
      mode: stream-one              # do not use auto — known client bugs
      tag: vless-xhttp-reality
    vision:
      enabled: true
      port: 8443
      tag: vless-vision-reality
    tls:
      enabled: false
      port: 2053
      sni: "proxy.example.com"
      alpn: ["h2", "http/1.1"]
      tag: vless-tls
    fragmentation:
      enabled: false
      strategy: serverhello
      length: "50-100"
      delay: "10-20"
      max_split: "2-4"

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  admin_ids: [123456789]

limits:
  default_traffic_gb: 50
  default_expire_days: 30
