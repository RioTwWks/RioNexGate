name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Install build deps (CGO/SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Go test
        working-directory: backend
        run: CGO_ENABLED=1 go test ./...

      - name: Install Xray-core
        run: |
          XRAY_VERSION=26.3.27
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          sudo apt-get install -y unzip
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Validate generated Xray config
        working-directory: backend
        env:
          CI: "true"
        run: CGO_ENABLED=1 go test ./internal/core -run TestXrayConfigValidate -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install build deps (CGO/SQLite)
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: e2e
        env:
          CI: "true"
          E2E_BACKEND_PORT: "18080"
          E2E_FRONTEND_PORT: "15173"
        run: npm test
