pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Access log without query strings (signed subscription URLs carry exp/sig)
    # and with the subscription bearer token masked — it lives in the URL path.
    map $uri $sanitized_uri {
        default                 $uri;
        ~^/api/subscription/.+$ /api/subscription/***;
    }

    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $sanitized_uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log sanitized;

    upstream backend {
        server backend:8080;
    }

    upstream frontend {
        server frontend:8080;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
            proxy_pass_request_headers on;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Device-Token $http_x_device_token;
            proxy_set_header X-Registration-Secret $http_x_registration_secret;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
