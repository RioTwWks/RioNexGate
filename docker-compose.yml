version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data:/app/data
      - ./backend/config.yaml:/app/config.yaml
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  xray-core:
    image: teddysun/xray:latest
    volumes:
      - ./data/xray:/etc/xray
      - ./data/xray/logs:/var/log/xray
    restart: unless-stopped
    network_mode: host   # для реального UDP и производительности

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    volumes:
      - ./data/sing-box:/etc/sing-box
    restart: unless-stopped
    network_mode: host