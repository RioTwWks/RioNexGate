services:
  backend:
    image: rionexgate-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/data
      - ./backend/config.yaml:/app/config.yaml:ro
    ports:
      # Loopback only — use nginx (:8888) as the public entrypoint.
      - "127.0.0.1:8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: rionexgate-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: rionexgate-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      # Container listens on 8080 (non-root); host still uses HTTP_PORT (default 8888).
      - "${HTTP_PORT:-8888}:8080"
      # HTTPS: cp nginx/nginx-https.conf.example nginx/nginx.conf, run scripts/letsencrypt.sh, then:
      # - "${HTTPS_PORT:-8443}:8443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  xray-core:
    profiles: ["cores"]
    build:
      context: .
      dockerfile: Dockerfile.xray
      args:
        XRAY_VERSION: ${XRAY_VERSION:-26.3.27}
    image: rionexgate-xray:${XRAY_VERSION:-26.3.27}
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/xray:/etc/xray
      - ./data/xray/logs:/var/log/xray
    restart: unless-stopped
    network_mode: host
    # Binds stealth inbounds on host ports 443 (XHTTP+Reality) and 8443 (Vision+Reality).
    # Requires core.stealth in config.yaml; may need cap_net_bind_service for port 443.
    # Runs as root for privileged ports — keep host firewall tight.

  sing-box:
    profiles: ["cores"]
    # Pin version (avoid :latest). Override with SINGBOX_IMAGE if needed.
    image: ${SINGBOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.14.2}
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/sing-box:/etc/sing-box
    command: ["run", "-c", "/etc/sing-box/config.json"]
    restart: unless-stopped
    network_mode: host

  skadi-core:
    profiles: ["cores"]
    build:
      context: .
      dockerfile: Dockerfile.skadi
      args:
        SKADI_VERSION: ${SKADI_VERSION:-0.1.3}
    image: rionexgate-skadi:${SKADI_VERSION:-0.1.3}
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/skadi:/config
    environment:
      - SKADICORE_BIN=/skadicore
    restart: unless-stopped
    network_mode: host
    # Binds Skadi listen port from generated skadi.toml (usually 443 with Reality+XHTTP).
    # Requires core.type: skadi and core.stealth Reality keys in config.yaml.

  amneziawg:
    profiles: ["awg"]
    # Pin tag (userspace amneziawg-go). Override with AWG_IMAGE if needed.
    image: ${AWG_IMAGE:-amneziavpn/amneziawg-go:3.1.20260828}
    pull_policy: if_not_present
    security_opt:
      - no-new-privileges:true
    # NET_ADMIN required for WG interface; SYS_MODULE not needed for userspace go.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    volumes: ["./data/awg:/etc/amneziawg"]
    ports: ["${AWG_PORT:-51820}:51820/udp"]
    restart: unless-stopped
