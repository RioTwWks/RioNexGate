services:
  backend:
    image: rionexgate-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data:/app/data
      - ./backend/config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: rionexgate-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: rionexgate-nginx:latest
    build:
      context: .
      dockerfile: Dockerfile.nginx
    volumes:
      - ./data/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HTTP_PORT:-8888}:80"
      # HTTPS: cp nginx/nginx-https.conf.example nginx/nginx.conf, run scripts/letsencrypt.sh, then:
      # - "${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  xray-core:
    profiles: ["cores"]
    build:
      context: .
      dockerfile: Dockerfile.xray
      args:
        XRAY_VERSION: ${XRAY_VERSION:-26.3.27}
    image: rionexgate-xray:${XRAY_VERSION:-26.3.27}
    pull_policy: if_not_present
    volumes:
      - ./data/xray:/etc/xray
      - ./data/xray/logs:/var/log/xray
    restart: unless-stopped
    network_mode: host
    # Binds stealth inbounds on host ports 443 (XHTTP+Reality) and 8443 (Vision+Reality).
    # Requires core.stealth in config.yaml; may need cap_net_bind_service for port 443.

  sing-box:
    profiles: ["cores"]
    image: ghcr.io/sagernet/sing-box:latest
    pull_policy: if_not_present
    volumes:
      - ./data/sing-box:/etc/sing-box
    command: ["run", "-c", "/etc/sing-box/config.json"]
    restart: unless-stopped
    network_mode: host

  amneziawg:
    profiles: ["awg"]
    image: amneziavpn/amneziawg-go:latest
    pull_policy: if_not_present
    cap_add: [NET_ADMIN, SYS_MODULE]
    volumes: ["./data/awg:/etc/amneziawg"]
    ports: ["${AWG_PORT:-51820}:51820/udp"]
    restart: unless-stopped
